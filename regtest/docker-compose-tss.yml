services:
  goat-network-tss-node1:
    image: anvztor/tss:dev
    container_name: goat-network-tss-node1
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/evm/address?kdd=1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - SHARED_AES_KEY=8bf89ccc1c7f5925c38f5f908c14e627eb346e0761e4a6885e61ce9687cb4435
    ports:
      - "8081:8080" # http port
      - "9091:9009" # p2p port
    volumes:
      - ./data/tss/node1/data:/app/data
      - ./data/tss/node1/config:/app/config
    networks:
      goat_network:
        ipv4_address: 172.31.32.91

  goat-network-tss-node2:
    image: anvztor/tss:dev
    container_name: goat-network-tss-node2
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/evm/address?kdd=1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - SHARED_AES_KEY=dc655cab68cfcff6f253ff37f2fe6b1b86c8ee7f68d7b64bb8bd8f28d7a528f4
    ports:
      - "8082:8080" # http port
      - "9092:9009" # p2p port
    volumes:
      - ./data/tss/node2/data:/app/data
      - ./data/tss/node2/config:/app/config
    networks:
      goat_network:
        ipv4_address: 172.31.32.92

  goat-network-tss-node3:
    image: anvztor/tss:dev
    container_name: goat-network-tss-node3
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/evm/address?kdd=1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - SHARED_AES_KEY=ea29d2149f47887d2247cf5d9876373704e958affd1cdc25d17463b11aad9026
    ports:
      - "8083:8080" # http port
      - "9093:9009" # p2p port
    volumes:
      - ./data/tss/node3/data:/app/data
      - ./data/tss/node3/config:/app/config
    networks:
      goat_network:
        ipv4_address: 172.31.32.93

networks:
  goat_network:
    external: true