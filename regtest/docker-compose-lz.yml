name: goat-regtest

# LayerZero OFT bridge layer (oh-my-lazier OpenDVN + OpenExecutor).
#
# Maps the two LayerZero endpoints onto the regtest stack:
#   chain A = EVM-regtest  (source; holds the GOATED supply)  -> service lz-anvil-a below
#   chain B = GOAT-regtest (goat-geth EVM RPC)                -> service `geth` in
#             docker-compose-goat-geth.yml (container goat-regtest-geth-node:8545, chainId 48815)
#
# The relay = TWO oh-my-lazier worker instances (keystore-only, no KMS):
#   lz-worker-1 = OpenExecutor + PRIMARY OpenDVN   (DB: lz-postgres)
#   lz-worker-2 = SECONDARY OpenDVN                (DB: lz-postgres-2)
# They coordinate on-chain via PayloadVerified. Configs (worker-1.container.yaml,
# worker-2.container.yaml) come from dev-bugfix's deploy (or gen-worker-config.sh)
# and are mounted from ./lz. chain A mines continuously (--block-time 2) so source
# packets keep confirming.
#
# Bring up alongside the base stack:
#   docker compose -f docker-compose.yml -f docker-compose-lz.yml up -d geth goat lz-anvil-a lz-postgres lz-postgres-2
#   # (dev-bugfix deploys OFT + drops worker-1/2.container.yaml into ./lz)
#   docker compose -f docker-compose.yml -f docker-compose-lz.yml up -d lz-worker-1 lz-worker-2

services:
  # --- chain A: source EVM-regtest (holds GOATED supply) ---
  lz-anvil-a:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: goat-regtest-lz-anvil-a
    entrypoint: ["anvil"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "31337"
      - --mnemonic
      - "test test test test test test test test test test test junk"
      - --accounts
      - "10"
      - --balance
      - "10000"
      # Continuous 2s blocks: LayerZero source packets need blocks to keep
      # advancing to confirm; on-demand mining would stall the DVN/indexer.
      - --block-time
      - "2"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
    ports:
      - 18545:8545
    networks:
      - goat_network

  # --- worker state DB ---
  lz-postgres:
    image: postgres:18-alpine
    container_name: goat-regtest-lz-postgres
    environment:
      POSTGRES_DB: laz_worker
      POSTGRES_USER: laz_worker
      POSTGRES_PASSWORD: laz_worker
    ports:
      - 55432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laz_worker -d laz_worker"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - goat_network

  # Second worker DB (each worker instance needs its OWN database).
  lz-postgres-2:
    image: postgres:18-alpine
    container_name: goat-regtest-lz-postgres-2
    environment:
      POSTGRES_DB: laz_worker
      POSTGRES_USER: laz_worker
      POSTGRES_PASSWORD: laz_worker
    ports:
      - 55434:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laz_worker -d laz_worker"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - goat_network

  # --- The relay = TWO oh-my-lazier worker instances (keystore-only, no KMS) ---
  # worker-1 = OpenExecutor + PRIMARY OpenDVN ; worker-2 = SECONDARY OpenDVN.
  # They coordinate on-chain via PayloadVerified, each with its own DB.
  # Build the image first from the oh-my-lazier checkout:
  #   docker build -t oh-my-lazier-worker:local /path/to/oh-my-lazier
  # Config files (worker-1.container.yaml, worker-2.container.yaml) come from
  # dev-bugfix's deploy (or regtest/lz/gen-worker-config.sh) and live in ./lz.
  # dev-bugfix runs the worker with -skip-onchain-check (regtest uses 1 required DVN;
  # configcheck insists on >=2). If dev-bugfix ships a compose fragment, prefer it.
  lz-worker-1:
    image: oh-my-lazier-worker:local
    container_name: goat-regtest-lz-worker-1
    command: ["-config", "/app/tmp/worker-1.container.yaml", "-skip-onchain-check"]
    depends_on:
      lz-postgres:
        condition: service_healthy
      lz-anvil-a:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://laz_worker:laz_worker@lz-postgres:5432/laz_worker?sslmode=disable
      E2E_KEYSTORE_PASSWORD: ${E2E_KEYSTORE_PASSWORD:-local-e2e-password}
    ports:
      - 19090:9090
    volumes:
      - ./lz:/app/tmp:ro
    networks:
      - goat_network

  lz-worker-2:
    image: oh-my-lazier-worker:local
    container_name: goat-regtest-lz-worker-2
    command: ["-config", "/app/tmp/worker-2.container.yaml", "-skip-onchain-check"]
    depends_on:
      lz-postgres-2:
        condition: service_healthy
      lz-anvil-a:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://laz_worker:laz_worker@lz-postgres-2:5432/laz_worker?sslmode=disable
      E2E_KEYSTORE_PASSWORD: ${E2E_KEYSTORE_PASSWORD:-local-e2e-password}
    ports:
      - 19091:9090
    volumes:
      - ./lz:/app/tmp:ro
    networks:
      - goat_network

  # --- LayerZero OFT bridge frontend (submodule/bridge-fe) ---
  # Served on :3005 to avoid clashing with the BTC-bridge FE on :3000.
  # NOTE: full wiring to the regtest OFT endpoints still needs a regtest entry in
  # submodule/bridge-fe/src/config/{env.ts,app.ts} (env enum is dev|staging|mainnet
  # only) populated with the deployed GOATED/TestOFT addresses on chain A (31337)
  # and chain B (48815), EIDs 90101/90102, and local RPC URLs. Those addresses are
  # pending dev-bugfix's deploy; see _coord for the FE-config approach decision.
  lz-bridge-fe:
    build:
      context: ../submodule/bridge-fe
      dockerfile: Dockerfile
    image: goat-bridge-fe:regtest
    container_name: goat-regtest-lz-bridge-fe
    environment:
      - NODE_ENV=development
      # Switch to `regtest` once a regtest env is added to src/config/env.ts+app.ts.
      - NEXT_PUBLIC_ENVIRONMENT=${BRIDGE_FE_ENV:-development}
    ports:
      - 3005:3000
    networks:
      - goat_network

networks:
  goat_network:
    external: true
