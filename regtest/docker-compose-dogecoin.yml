name: dogecoin-regtest

services:
  # Dogecoin Core Node
  dogecoin-node:
    image: dogeorg/dogecoin-node:ubuntu
    container_name: dogecoin-node
    command: ["dogecoind", "-regtest", "-printtoconsole", "-rpcbind=0.0.0.0", "-rpcallowip=0.0.0.0/0", "-rpcuser=gigawallet", "-rpcpassword=gigawallet", "-rpcport=22555"]
    ports:
      - "22555:22555"
      - "22556:22556"
      - "28332:28332"
    volumes:
      - ./data/dogecoin-data:/root/.dogecoin
    restart: unless-stopped
    networks:
      - goat_network

  # Automatic miner that generates blocks at a fixed interval
  dogecoin-miner:
    image: dogeorg/dogecoin-node:ubuntu
    container_name: dogecoin-miner
    depends_on:
      - dogecoin-node
    environment:
      - rpcuser=gigawallet
      - rpcpassword=gigawallet
      - rpchost=dogecoin-node
      - rpcport=22555
      - MINING_INTERVAL=30   # seconds between blocks
      - PREMINE_BLOCKS=200    # one-time blocks mined on first start
      # Optionally supply your own address & WIF (leave blank to auto-generate)
      - MINER_ADDRESS=
      - MINER_WIF=
    volumes:
      - ./scripts/miner_entrypoint.sh:/usr/local/bin/miner_entrypoint.sh:ro
      - ./data/dogecoin-data:/root/.dogecoin
    entrypoint: ["bash", "/usr/local/bin/miner_entrypoint.sh"]
    networks:
      - goat_network

networks:
  goat_network:
    external: true
