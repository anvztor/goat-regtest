services:
  dogecoin-node:
    extends:
      file: docker-compose-dogecoin.yml
      service: dogecoin-node

  geth:
    depends_on:
      - dogecoin-node
    extends:
      file: docker-compose-geth.yml
      service: geth

  deploy-contract:
    depends_on:
      geth:
        condition: service_healthy  
    extends:
      file: docker-compose-geth.yml
      service: deploy-contract

  goat-network-tss-node1:
    extends:
      file: docker-compose-tss.yml
      service: goat-network-tss-node1

  goat-network-tss-node2:
    extends:
      file: docker-compose-tss.yml
      service: goat-network-tss-node2

  goat-network-tss-node3:
    extends:
      file: docker-compose-tss.yml
      service: goat-network-tss-node3

  goat-relayer-1:
    depends_on:
      goat:
        condition: service_healthy
      goat-network-tss-node1:
        condition: service_healthy
    extends:
      file: docker-compose-relayer.yml
      service: goat-relayer-1

  goat-relayer-2:
    depends_on:
      - goat-relayer-1
    extends:
      file: docker-compose-relayer.yml
      service: goat-relayer-2

  goat-relayer-3:
    depends_on:
      - goat-relayer-1
    extends:
      file: docker-compose-relayer.yml
      service: goat-relayer-3

networks:
  goat_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.32.0/20
          gateway: 172.31.32.1