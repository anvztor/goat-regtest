name: dogecoin-regtest

services:
  geth:
    image: anvztor/geth:latest
    container_name: goat-regtest-geth-node
    pull_policy: if_not_present
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "geth attach --exec eth.blockNumber"]
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - --dev
      - --http
      - --http.api=personal,eth,net,web3
    ports:
      - 8545:8545
      - 8551:8551
      - 30303:30303
    volumes:
      - ./data/geth:/root/.ethereum
    networks:
      - goat_network

  deploy-contract:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: goat-regtest-deploy-contract
    restart: on-failure
    environment:
      - ADMIN_ADDR=0x29cF29d4b2CD6Db07f6db43243e8E43fE3DC468e
      - RELAYER_ADDR=0x7242C2F9692681526822FF325f31f807f851f0Bb                       
      - GOAT_BRIDGE_CONTRACT=0xBC10000000000000000000000000000000000003
      - BITCOIN_CONTRACT=0xbc10000000000000000000000000000000000005    
      - PRIVATE_KEY=0xe918dfc447c7c21100b1501ec5886f29e6537718589812326e0b9941b1812aa4
      - BSC_ETHERSCAN_API_KEY=1
    volumes:
      - ./data/deploy-contract:/app
    working_dir: /app
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - |
        cd /app
        git clone https://github.com/GOATNetwork/dogecoin-bridge-contract.git .
        forge install
        forge script script/Deploy.sol --rpc-url http://geth:8545 --broadcast --legacy
    depends_on:
      geth:
        condition: service_healthy
    networks:
      - goat_network

networks:
  goat_network:
    external: true